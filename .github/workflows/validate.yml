name: Validate Sims Tan
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --input-type=module --check < game-real.js
      - name: Verify playable entrypoint
        run: |
          test -s index.html
          test -s style.css
          test -s game-real.js
          grep -q 'game-real.js' index.html
          grep -q 'Televisor' game-real.js
          grep -q 'Ducha' game-real.js
          grep -q 'Cama' game-real.js
          grep -q 'Michelle.glb' game-real.js
          grep -q 'Multijugador' index.html
      - name: Verify public no-login CDN URL
        run: |
          URL="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_SHA}/index.html"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 20 "$URL" | grep -q 'game-real.js'; then
              echo "Public build available at $URL"
              exit 0
            fi
            sleep 3
          done
          exit 1
