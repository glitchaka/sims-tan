name: Validate Sims Tan
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --input-type=module --check < game-v2.js
      - name: Verify playable entrypoint
        run: |
          test -s index.html
          test -s style.css
          test -s game-v2.js
          grep -q 'game-v2.js' index.html
          grep -q 'Televisor' game-v2.js
          grep -q 'Ducha' game-v2.js
          grep -q 'Cama' game-v2.js
          grep -q 'Multijugador' index.html
