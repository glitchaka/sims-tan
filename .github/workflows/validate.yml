name: Validate Sims Tan
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --input-type=module --check < game.js
      - name: Verify required files
        run: test -s index.html && test -s style.css && test -s game.js
