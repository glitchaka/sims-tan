name: Browser Smoke Test
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: sims-tan-browser-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated browser driver
        run: |
          mkdir -p /tmp/smoke
          cd /tmp/smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.55.0
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/sims-tan-http.log 2>&1 &
          sleep 2
      - name: Exercise menu, creator, movement and HUD
        run: |
          node --input-type=module <<'EOF'
          import { createRequire } from 'node:module';
          const require=createRequire(import.meta.url);
          const { chromium }=require('/tmp/smoke/node_modules/playwright-core');
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const fatal=[];
          page.on('pageerror',e=>fatal.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')fatal.push(m.text())});
          await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForSelector('#game canvas',{timeout:45000});
          await page.click('[data-go="creator"]');
          await page.waitForFunction(()=>!document.querySelector('#creator').classList.contains('hidden'));
          await page.waitForTimeout(700);
          await page.fill('#charName','Alex');
          await page.click('#enterHome');
          await page.waitForFunction(()=>!document.querySelector('#hud').classList.contains('hidden'));
          if(!(await page.locator('.profile').isVisible()))throw new Error('Profile HUD did not become visible');
          if(!(await page.locator('.topbar').isVisible()))throw new Error('Top bar did not become visible');
          await page.keyboard.down('w');
          await page.waitForTimeout(600);
          await page.keyboard.up('w');
          await page.waitForTimeout(500);
          if(fatal.length)throw new Error('Browser errors: '+fatal.join(' | '));
          await browser.close();
          EOF