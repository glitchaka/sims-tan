<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sims Tan</title><link rel="stylesheet" href="style.css"></head><body><canvas id="game"></canvas><div id="menu" class="screen"><div class="glass hero"><small>SIMS TAN</small><h1>Tu vida. Tu mundo.</h1><p>Simulador social para PC y móvil.</p><button id="new">Nueva partida</button><button id="multi">Multijugador</button></div></div><div id="creator" class="screen hidden"><section class="creator"><div class="avatar"><div class="head"><i></i><b></b></div><div class="body"></div></div><div class="glass panel"><h2>Crear personaje</h2><label>Nombre<input id="name" value="Valentina" maxlength="24"></label><label>Tono de piel<input id="skin" type="range" min="0" max="4" value="2"></label><label>Cabello<select id="hair"><option>Negro</option><option>Castaño</option><option>Rubio</option><option>Pelirrojo</option></select></label><label>Complexión<input id="build" type="range" min="0" max="100" value="48"></label><label>Personalidad<select><option>Sociable</option><option>Creativa</option><option>Ambiciosa</option><option>Tranquila</option></select></label><button id="play">Entrar al hogar</button><button class="ghost" id="back">Volver</button></div></section></div><div id="hud" class="hidden"><div class="glass status"><strong id="who">Valentina</strong><span>😊 Bien</span></div><div class="needs glass"><span>Hambre <b></b></span><span>Energía <b></b></span><span>Social <b></b></span></div><div class="clock glass">☀ Lun 09:15<br>§ 2.450</div><div id="actions" class="glass actions hidden"><button data-act="sentarse">Sentarse</button><button data-act="dormir">Dormir</button><button data-act="mirar">Mirar</button></div><div class="hint">Toca un mueble · WASD/flechas para mover</div></div><div id="lobby" class="screen hidden"><div class="glass hero"><h2>Multijugador</h2><p>Base de sala compartida preparada para sincronización de jugadores.</p><div class="players"><span>● Tú</span><span>○ Esperando jugador…</span></div><button id="lobbyBack">Volver</button></div></div><script src="game.js"></script></body></html>
